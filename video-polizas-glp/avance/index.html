<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Avance video RCE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400..900&display=swap">
<style>
/* Avance formal: tarjetas ilustradas, paleta Solgas suave, Epilogue; fotos de fondo con velo claro y zoom lento. */
:root{--nv:#0A1F4F;--bl:#0047BB;--blT:#D6E3F8;--bl2:#8FB0EA;--cyT:#D3F0FA;--orT:#FFE2C7;--yeT:#FFEDB8;--or:#FF7A00;--ok:#12B76A;--no:#E5484D;--mut:#2A3A63}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Epilogue',sans-serif;color:var(--nv);background:#F7FAFE}
.L{position:absolute;inset:0}
.bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;opacity:0}
.velo{position:absolute;inset:0;opacity:0}
.sc{position:absolute;inset:0;visibility:hidden}
.k{position:absolute;background:#fff;border:5px solid var(--nv);border-radius:30px;box-shadow:12px 14px 0 var(--nv)}
.t{font-weight:900;letter-spacing:-.03em;line-height:1}
.pill{position:absolute;font-weight:900;font-size:30px;padding:12px 28px;border:4px solid var(--nv);border-radius:999px;box-shadow:6px 6px 0 var(--nv);white-space:nowrap}
.badge{position:absolute;border-radius:50%;border:5px solid var(--nv);box-shadow:9px 9px 0 var(--nv);display:grid;place-items:center}
.badge svg{width:56%;height:56%}
.cap{position:absolute;font-weight:900;font-size:34px;text-align:center;white-space:nowrap}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.w>span{display:inline-block}
.hl{background:var(--yeT);border-radius:14px;padding:0 12px}
.row{position:relative;padding:14px 0;border-bottom:2px solid #E6EBF3}
.row .l{font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.row .v{position:relative;display:inline-block;font-size:27px;font-weight:800;margin-top:6px;z-index:1}
.row .mk{position:absolute;left:-8px;right:-8px;top:6px;bottom:-2px;background:var(--yeT);z-index:-1;transform:scaleX(0);transform-origin:left;border-radius:6px}
.row .mk.r{background:#FFD3D5}
.dh{display:flex;align-items:center;gap:16px;padding:22px 30px;border-bottom:5px solid var(--nv);border-radius:25px 25px 0 0}
.dh svg{width:44px;height:44px;flex:none}
.dh b{display:block;font-size:28px;font-weight:900}
.dh small{display:block;font-size:18px;font-weight:600;color:var(--mut)}
.rows{padding:8px 30px 22px}
.mark{position:absolute;width:76px;height:76px;border-radius:50%;border:5px solid var(--nv);display:grid;place-items:center;box-shadow:5px 5px 0 var(--nv)}
.mark svg{width:42px;height:42px}
#hud{position:absolute;left:56px;top:44px;display:flex;align-items:center;gap:14px;opacity:0}
#hud .n{background:var(--or);color:var(--nv);font-weight:900;font-size:24px;padding:8px 14px;border:4px solid var(--nv);border-radius:12px;box-shadow:4px 4px 0 var(--nv)}
#hud .tx{font-weight:900;font-size:24px;letter-spacing:.08em;text-transform:uppercase;background:#fff;padding:8px 16px;border:4px solid var(--nv);border-radius:12px;box-shadow:4px 4px 0 var(--nv)}
#prog{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(10,31,79,.08)}
#prog i{display:block;height:100%;background:var(--or);transform-origin:left;transform:scaleX(0)}
.wipe{position:absolute;top:-200px;height:1480px;width:900px;transform:translateX(-3000px) skewX(-14deg);border-left:6px solid var(--nv);border-right:6px solid var(--nv)}
.bar{position:absolute;bottom:0;width:150px;border:5px solid var(--nv);border-radius:24px 24px 0 0;transform-origin:bottom}
.ln{position:absolute;height:12px;border-radius:6px;background:#E4E9F2}
</style></head>
<body><div id="stage">
  <div class="L" id="bgs"></div>
  <div class="L" id="fx"></div>
  <div id="hud"><span class="n" id="hudn">01</span><span class="tx" id="hudt"></span></div>
  <div id="prog"><i></i></div>
  <div class="L" id="wipes"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
// ---------- datos de locución (duraciones reales de cada frase) ----------
const VOZ = { e1a: 10.441, e1b: 12.539, e3a: 9.464, e3b: 4.4, e3c: 10.056, e4b: 11.604, e4c: 5.158, e4g: 10.382, e8f: 8.809, e8g: 6.5, e9g: 8.46 };
const TXT = {
  e1a: 'Para la autorización y operación de un consumidor directo de GLP, la gestión de la póliza de responsabilidad civil extracontractual no debe limitarse a disponer de un documento vigente,',
  e1b: 'sino comprender que dicha póliza representa un elemento importante para la protección de Solgas frente a las consecuencias económicas de determinados accidentes que puedan afectar a las instalaciones, terceros y al medio ambiente.',
  e3a: 'El monto mínimo asegurado de las pólizas de responsabilidad civil extracontractual para un consumidor directo de GLP depende de la capacidad de almacenamiento del tanque,',
  e3b: 'siendo desde 100 UIT como mínimo hasta 300 UIT como máximo.',
  e3c: 'Para el caso de Consumidores Directos de GLP con sistemas de despacho para uso automotor, el monto es de 300 UIT, independientemente de la capacidad de almacenamiento del tanque.',
  e4b: 'La póliza debe consignar la Razón Social y el RUC, descritos tal cual se muestran en su consulta RUC SUNAT, y ser similar a los datos registrados como titular en la solicitud del Registro de Hidrocarburos,',
  e4c: 'de manera que exista correspondencia entre la información del seguro y la información registral.',
  e4g: 'Una póliza con datos de Razón Social, RUC y/o actividad escritos de forma inexacta puede generar observaciones para la autorización, y/o limitaciones en su activación ante una emergencia.',
  e8f: 'Antes de presentar un expediente o atender una supervisión, resulta conveniente contrastar la documentación con la información del Registro de Hidrocarburos',
  e8g: 'y verificar que no existan diferencias en la identidad del titular, la actividad, la ubicación o el monto asegurado.',
  e9g: 'La prevención comienza con el conocimiento de las obligaciones y se fortalece mediante una gestión rigurosa de los riesgos y de las coberturas contratadas.',
};
// guion del avance: [escena, frase, inicio]
const PLAN = [['A', 'e1a', 5.0], ['A', 'e1b', 15.8], ['B', 'e3a', 31.4], ['B', 'e3b', 41.2], ['B', 'e3c', 46.0], ['C', 'e4b', 59.6], ['C', 'e4c', 71.6], ['C', 'e4g', 77.4], ['D', 'e8f', 91.4], ['D', 'e8g', 100.6], ['E', 'e9g', 109.4]];
const SC = { A: [0, 29], B: [29, 57.2], C: [57.2, 89], D: [89, 107.6], E: [107.6, 125] };
const TOTAL = 125;
const S = id => PLAN.find(p => p[1] === id)[2], E = id => S(id) + VOZ[id];
const W = (id, w, off = 0) => { const i = TXT[id].indexOf(w); if (i < 0) throw new Error(id + ':' + w); return S(id) + 0.1 + i / TXT[id].length * (VOZ[id] - 0.2) + off; };
window.PLAN = PLAN; window.VOZ = VOZ; window.TOTAL = TOTAL;

// ---------- utilidades ----------
gsap.defaults({ ease: 'power3.out' });
const tl = gsap.timeline({ paused: true });
const SFX = []; window.SFX = SFX;
const FX = document.getElementById('fx'), BGS = document.getElementById('bgs');
const el = (p, html, css = '', cls = '') => { const d = document.createElement('div'); if (cls) d.className = cls; d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; p.appendChild(d); return d; };
const hide = (e, v = {}) => gsap.set(e, Object.assign({ autoAlpha: 0 }, v));
function pop(e, t, o = {}) { SFX.push({ t, k: 'pop' }); hide(e, { scale: o.s ?? 0.4, rotation: o.r ?? -8 }); tl.to(e, { autoAlpha: 1, scale: 1, rotation: 0, duration: o.d ?? 0.8, ease: o.e ?? 'elastic.out(1,0.6)' }, t); return e; }
function rise(e, t, o = {}) { SFX.push({ t, k: 'tick' }); hide(e, { y: o.y ?? 140, x: o.x ?? 0, rotation: o.r ?? 4 }); tl.to(e, { autoAlpha: 1, x: 0, y: 0, rotation: 0, duration: o.d ?? 1, ease: 'elastic.out(1,0.65)' }, t); return e; }
function out(e, t, o = {}) { tl.to(e, Object.assign({ autoAlpha: 0, y: -40, duration: 0.4, ease: 'power2.in' }, o), t); }
function words(p, x, y, text, size, o = {}) {
  const HL = new Set(), toks = text.replace(/\*([^*]+)\*/g, (m, g) => { const k = g.split(' ').join('\u00a0'); HL.add(k); return k; }).split(' ');
  const h = toks.map(w => w === '/' ? '<br>' : `<span class="w"><span${HL.has(w) ? ' class="hl"' : ''}>${w}</span></span>`).join(' ');
  const d = el(p, h, `left:${x}px;top:${y}px;width:${o.w ?? 1500}px;font-size:${size}px;text-align:${o.a ?? 'left'};line-height:1.04`, 't');
  hide(d); return d;
}
function wordsIn(d, t) { SFX.push({ t, k: 'swish' }); const ws = d.querySelectorAll('.w>span'); gsap.set(ws, { yPercent: 120 }); tl.set(d, { autoAlpha: 1 }, t); tl.to(ws, { yPercent: 0, duration: 0.8, ease: 'expo.out', stagger: 0.06 }, t); }
const IC = {
  doc: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  factory: '<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  fuel: '<line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  list: '<path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/>',
};
const ic = (n, c = 'currentColor', sw = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
function mark(p, x, y, ok, t) { SFX.push({ t: t + 0.1, k: ok ? 'ok' : 'no' }); const m = el(p, ic(ok ? 'check' : 'x', '#fff', 3.4), `left:${x}px;top:${y}px;background:${ok ? 'var(--ok)' : 'var(--no)'}`, 'mark'); pop(m, t, { s: 0, r: -90, e: 'back.out(3)', d: 0.5 }); return m; }
function scene(id) { const c = el(FX, '', '', 'sc'); tl.set(c, { visibility: 'visible' }, SC[id][0]); tl.set(c, { visibility: 'hidden' }, SC[id][1]); return c; }
// fondo fotográfico con velo y zoom lento
// variantes de velo (?velo=N); sin parámetro se usa el velo blanco original
const VELOS = {
  azul:    { c1: [226, 234, 248], c2: [226, 234, 248], a: [.84, .64, .26] },
  celeste: { c1: [218, 241, 250], c2: [218, 241, 250], a: [.88, .66, .26] },
  durazno: { c1: [255, 239, 226], c2: [255, 239, 226], a: [.84, .64, .26] },
  duo:     { c1: [226, 234, 248], c2: [255, 232, 212], a: [.86, .64, .30] },
  entonada:{ tint: ['#0047BB', .30, 'color'], c1: [238, 243, 252], c2: [238, 243, 252], a: [.80, .56, .18] },
  bruma:   { tint: ['#8FB0EA', .45, 'multiply'], c1: [244, 247, 253], c2: [255, 240, 228], a: [.80, .56, .16] },
};
const VEL = VELOS[new URLSearchParams(location.search).get('velo') || 'celeste'];  // elegido: celeste suave
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function veloFor(id) {
  const { c1, c2, a } = VEL;
  if (id === 'D') return `linear-gradient(90deg,${rgba(c1, a[0] * .97)},${rgba(c2, a[0] * .93)})`;
  if (id === 'E') return `linear-gradient(180deg,${rgba(c1, a[0])} 0%,${rgba(c1, a[1] + .1)} 60%,${rgba(c2, a[2] + .15)} 100%)`;
  return `linear-gradient(90deg,${rgba(c1, a[0])} 0%,${rgba(c1, a[1])} 45%,${rgba(c2, a[2])} 100%)`;
}
function photo(id, src, velo, pos = 'center') {
  const b = el(BGS, '', `background-image:url(${src});background-position:${pos}`, 'bgimg');
  const layers = [b];
  if (VEL) { velo = veloFor(id); if (VEL.tint) layers.push(el(BGS, '', `background:${VEL.tint[0]};mix-blend-mode:${VEL.tint[2]}`, 'velo')); }
  const v = el(BGS, '', `background:${velo}`, 'velo'); layers.push(v);
  const tint = VEL && VEL.tint ? layers[1] : null;
  const [a, z] = SC[id];
  tl.to([b, v], { opacity: 1, duration: 0.8, ease: 'power2.inOut' }, a);
  if (tint) { tl.to(tint, { opacity: VEL.tint[1], duration: 0.8 }, a); tl.to(tint, { opacity: 0, duration: 0.6 }, z + 0.3); }
  tl.fromTo(b, { scale: 1.0 }, { scale: 1.09, duration: z - a + 1, ease: 'none', immediateRender: false }, a);
  tl.to([b, v], { opacity: 0, duration: 0.6 }, z + 0.3);
}
function texture(id) {
  let s = '';
  for (let i = 0; i < 16; i++) for (let j = 0; j < 7; j++) { const x = i * 130 + (j % 2) * 65, y = j * 160 + 10, k = (i * 5 + j * 3) % 3;
    s += `<g transform="translate(${x} ${y}) rotate(${(i + j) % 2 ? -8 : 8})" opacity=".1" fill="none" stroke="#0A1F4F" stroke-width="4" stroke-linecap="round">${k === 0 ? '<path d="M0 0 H44 L58 14 V76 H0 Z"/><path d="M12 30 H46 M12 44 H40"/>' : k === 1 ? '<circle cx="30" cy="38" r="26"/><path d="M18 38 l8 8 l16 -16"/>' : '<path d="M30 4 L56 14 V36 C56 54 42 64 30 70 C18 64 4 54 4 36 V14 Z"/>'}</g>`; }
  const b = el(BGS, `<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#F7FAFE"/><circle cx="260" cy="120" r="380" fill="#FFF1E3"/><circle cx="1760" cy="1000" r="480" fill="#EAF1FB"/>${s}</svg>`, '', 'bgimg');
  const [a, z] = SC[id];
  tl.to(b, { opacity: 1, duration: 0.6 }, a); tl.fromTo(b, { x: 0 }, { x: -40, duration: z - a, ease: 'none', immediateRender: false }, a); tl.to(b, { opacity: 0, duration: 0.5 }, z + 0.3);
}
function hud(t, n, txt) { tl.to('#hud', { opacity: 0, duration: 0.2 }, t - 0.2); tl.set('#hudn', { textContent: n }, t); tl.set('#hudt', { textContent: txt }, t); tl.to('#hud', { opacity: 1, duration: 0.4 }, t + 0.1); }
function wipe(t) {
  SFX.push({ t: t - 0.4, k: 'whoosh' });
  ['var(--or)', 'var(--blT)', 'var(--bl)', '#fff'].forEach((c, i) => {
    const w = el(document.getElementById('wipes'), '', `background:${c};left:0;width:${i === 3 ? 2600 : 900}px`, 'wipe');
    tl.fromTo(w, { x: -3200 + i * 30 }, { x: 2700, duration: 1.15, ease: 'power3.inOut', immediateRender: false }, t - 0.6 + i * 0.06);
  });
}
function chapter(c, t, num, title, sub) {
  const box = el(c, `<div class="t" style="font-size:240px;color:transparent;-webkit-text-stroke:5px var(--or);line-height:1">${num}</div>`, 'left:150px;top:300px');
  const tt = words(c, 470, 340, title, 96, { w: 1300 });
  const sb = el(c, sub, 'left:474px;top:560px;font-size:34px;font-weight:600;color:var(--mut);width:1200px');
  rise(box, t, { y: 80 }); wordsIn(tt, t + 0.1); rise(sb, t + 0.4, { y: 40 });
  out([box, tt, sb], t + 2.1);
}
const card = (p, x, y, w, h, inner, css = '') => el(p, inner, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${css}`, 'k');

// =============== A · INTRODUCCIÓN (foto zona industrial) ===============
(() => {
  const c = scene('A');
  photo('A', '../fotos/foto6.jpg', 'linear-gradient(90deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.78) 45%,rgba(255,255,255,.35) 100%)');
  const pill = el(c, 'Capacitación · Consumidor directo de GLP', 'left:150px;top:300px;background:var(--orT)', 'pill');
  pop(pill, 0.5);
  const t1 = words(c, 150, 380, 'Pólizas de Responsabilidad / Civil *Extracontractual*', 108, { w: 1600 }); wordsIn(t1, 0.8);
  const sub = el(c, 'Aspectos clave para revisar la póliza y prevenir observaciones', 'left:154px;top:640px;font-size:36px;font-weight:600;color:var(--mut)');
  rise(sub, 1.6, { y: 40 });
  out([pill, t1, sub], 4.4);
  hud(5.0, '01', 'Introducción');
  // e1a: la póliza no es solo un documento vigente
  const doc = card(c, 1180, 210, 560, 640, `<div class="dh" style="background:var(--blT)">${ic('shield', '#0A1F4F')}<div><b>Póliza RCE</b><small>Responsabilidad Civil Extracontractual</small></div></div>
    <div class="rows">${['Asegurado', 'Vigencia', 'Coberturas', 'Monto asegurado'].map(l => `<div class="row"><div class="l">${l}</div><div style="height:14px;width:${240 + l.length * 8}px;background:#E4E9F2;border-radius:7px;margin-top:10px"></div></div>`).join('')}</div>`);
  rise(doc, W('e1a', 'póliza', -0.4), { x: 300, y: 0, r: 8 });
  const k1 = words(c, 150, 330, 'La póliza es / más que un / *documento vigente*', 86, { w: 980 }); wordsIn(k1, S('e1a') + 0.3);
  const st = el(c, 'VIGENTE', 'left:1420px;top:740px;background:var(--ok);color:#fff;transform:rotate(-10deg)', 'pill');
  pop(st, W('e1a', 'documento vigente'), { s: 2.4, r: -30, e: 'power4.in', d: 0.35 });
  out([k1], E('e1a'));
  // e1b: protección frente a consecuencias económicas
  const k2 = words(c, 150, 190, 'Protección / para *Solgas*', 86, { w: 1000 }); wordsIn(k2, S('e1b') + 0.1);
  const k3 = el(c, 'frente a las consecuencias económicas de accidentes que afecten a:', 'left:154px;top:400px;width:900px;font-size:34px;font-weight:700;color:var(--mut);line-height:1.3');
  rise(k3, W('e1b', 'consecuencias', -0.4), { y: 40 });
  [['factory', 'Instalaciones', 'var(--cyT)', 'instalaciones'], ['users', 'Terceros', 'var(--orT)', 'terceros'], ['leaf', 'Medio ambiente', 'var(--yeT)', 'medio ambiente']].forEach(([n, l, bg, w], i) => {
    const b = el(c, ic(n, '#0A1F4F', 1.9), `left:${170 + i * 330}px;top:540px;width:210px;height:210px;background:${bg}`, 'badge');
    const cp = el(c, l, `left:${120 + i * 330}px;top:785px;width:310px`, 'cap');
    pop(b, W('e1b', w, -0.3)); rise(cp, W('e1b', w, -0.1), { y: 30 });
  });
  out(c.querySelectorAll('.k,.pill,.badge,.cap,.t,div[style*="top:400px"]'), SC.A[1] - 0.4);
})();

// =============== B · MONTOS MÍNIMOS (foto del tanque) ===============
(() => {
  const c = scene('B');
  wipe(SC.B[0]);
  photo('B', '../fotos/foto4.jpg', 'linear-gradient(90deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.86) 50%,rgba(255,255,255,.25) 100%)', '70% center');
  chapter(c, SC.B[0] + 0.3, '03', 'Montos *mínimos*', 'Según la capacidad de almacenamiento del tanque');
  hud(SC.B[0] + 2.4, '03', 'Montos mínimos');
  const law = el(c, 'Art. 32 · D.S. N.º 01-94-EM', 'left:150px;top:160px;background:var(--blT)', 'pill');
  pop(law, S('e3a') + 0.2);
  const k = words(c, 150, 250, 'El monto depende de la / *capacidad del tanque*', 74, { w: 1100 }); wordsIn(k, S('e3a') + 0.5);
  const ch = card(c, 150, 455, 1000, 480, '', 'background:#fff');

tl.to('#prog i', { scaleX: 1, duration: TOTAL, ease: 'none' }, 0);
tl.to({}, { duration: 0.01 }, TOTAL);
function applyRoute() {
  if (!ROUTE.marker || !ROUTE.segs.length) return;
  ROUTE.segs.forEach((p, i) => { p.style.strokeDasharray = `${ROUTE.L[i]} ${ROUTE.L[i]}`; p.style.strokeDashoffset = ROUTE.L[i] * (1 - ROUTE.prog[i].v); });
  let i = ROUTE.prog.findIndex(o => o.v < 1); if (i < 0) i = 2;
  const pt = ROUTE.segs[i].getPointAtLength(ROUTE.L[i] * ROUTE.prog[i].v);
  ROUTE.marker.style.left = pt.x + 'px'; ROUTE.marker.style.top = pt.y + 'px';
}
window.renderAt = t => { tl.time(t, false); applyRoute(); };
window.DURATION = TOTAL;
window.renderAt(0);
document.fonts.ready.then(() => { window.READY = true; });
