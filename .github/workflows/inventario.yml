name: Inventario OV Corp

# Verifica y publica el sistema que está en ov-corp-inventario/ en https://inventario.ovcorp.com.pe.
# Se publica en cada push a master o a claude/untitled-session-hbq806 que toque esa carpeta,
# o a mano desde Actions → "Inventario OV Corp" → Run workflow.
on:
  push:
    branches: [master, claude/untitled-session-hbq806]
    paths: ['ov-corp-inventario/**', '.github/workflows/inventario.yml']
  pull_request:
    paths: ['ov-corp-inventario/**', '.github/workflows/inventario.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ov-corp-inventario

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ov-corp-inventario/.nvmrc
          cache: npm
          cache-dependency-path: ov-corp-inventario/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ov-corp-inventario .

  desplegar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [verificar, docker]
    # Nunca dos despliegues al mismo tiempo.
    concurrency:
      group: produccion
      cancel-in-progress: false
    environment:
      name: produccion
      url: https://inventario.ovcorp.com.pe
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      CARPETA: ov-corp-inventario
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        id: secretos
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          faltan=""
          for s in VPS_HOST VPS_USER VPS_SSH_KEY ACME_EMAIL; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::warning::No se publicó: faltan los secretos$faltan (ver ov-corp-inventario/docs/DESPLIEGUE.md)."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar SSH
        if: steps.secretos.outputs.listo == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          # Huella del servidor: si está guardada como secreto se usa esa (más seguro); si no, se lee del servidor.
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/despliegue
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copiar el código al servidor
        if: steps.secretos.outputs.listo == 'true'
        run: |
          ssh vps "mkdir -p ~/$CARPETA"
          # Nunca se tocan en el servidor: .env (secretos) ni data/ (base de datos).
          rsync -az --delete \
            --exclude 'node_modules/' --exclude 'data/' --exclude '.env' --exclude 'certs/' \
            ./ "vps:~/$CARPETA/"

      - name: Instalar o actualizar
        if: steps.secretos.outputs.listo == 'true'
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_INICIAL }}
        run: |
          # Los valores viajan por la entrada estándar, no en la línea de comandos (no quedan en el historial).
          printf 'ACME_EMAIL=%q\nADMIN_PASSWORD=%q\n' "$ACME_EMAIL" "$ADMIN_PASSWORD" | ssh vps \
            "cd ~/$CARPETA && set -a && . /dev/stdin && set +a && sudo -E NO_INTERACTIVO=1 ./deploy/instalar.sh"

      - name: Verificar que responde por HTTPS
        if: steps.secretos.outputs.listo == 'true'
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors https://inventario.ovcorp.com.pe/salud
          echo
          echo "Publicado en https://inventario.ovcorp.com.pe"
