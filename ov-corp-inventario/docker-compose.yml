# Producción en https://inventario.ovcorp.com.pe con HTTPS automático (necesario para la cámara del celular).
# Instalación guiada: sudo ./deploy/instalar.sh   (detalles en docs/DESPLIEGUE.md)
# Nombre fijo: aunque se instale en otra carpeta, es el mismo sistema con los mismos datos.
name: ov-corp-inventario

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - datos:/app/data
    # Solo accesible desde el propio servidor: lo publica Caddy o, si el servidor ya tiene
    # Nginx/Apache en los puertos 80 y 443, ese servidor web (lo configura deploy/instalar.sh).
    ports:
      - "127.0.0.1:${PUERTO_LOCAL:-3080}:3000"

  # Proxy HTTPS propio. Se activa con COMPOSE_PROFILES=caddy en .env cuando los puertos 80 y 443 están libres.
  caddy:
    profiles: [caddy]
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-inventario.ovcorp.com.pe}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env (correo para avisos del certificado HTTPS)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on:
      - app

volumes:
  datos:
  caddy_datos:
